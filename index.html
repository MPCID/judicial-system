<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>智慧偵詢分析系統｜臺北憲兵隊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
:root{--bg:#0a0c0f;--sur:#111418;--sur2:#181c22;--bor:#252a32;--bor2:#2e3440;--gold:#c8a96e;--gold2:#e8c98e;--red:#e05252;--green:#4caf7d;--blue:#4a90d9;--text:#e8eaf0;--muted:#6b7280;--dim:#3d4452;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:14px;line-height:1.5;height:100%;overflow:hidden;}
.mono{font-family:'JetBrains Mono',monospace;font-weight:400;}

/* Layout */
.app-wrapper{display:flex;flex-direction:column;height:100vh;background-image:radial-gradient(circle at 50% 0%, #161a22 0%, #0a0c0f 100%);}
header{flex-shrink:0;height:60px;background:#000;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100;}
main{flex:1;display:flex;overflow:hidden;padding:20px;gap:20px;}

/* Left Column: Input */
.col-input{flex:1;display:flex;flex-direction:column;gap:15px;min-width:0;}
.input-card{flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;}
.card-header{padding:12px 18px;background:var(--sur2);border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;}
.card-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;}

textarea{flex:1;background:transparent;border:none;color:#fff;padding:20px;font-size:15px;line-height:1.7;resize:none;outline:none;}
textarea::placeholder{color:var(--dim);}

/* Right Column: Output */
.col-output{width:420px;display:flex;flex-direction:column;gap:15px;flex-shrink:0;}
.output-card{flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,0.4);}
#resultArea{flex:1;overflow-y:auto;padding:20px;background-image:linear-gradient(to bottom, transparent, rgba(0,0,0,0.2));}

/* Buttons */
.btn-ai{background:linear-gradient(135deg, #b8944a, #c8a96e);color:#000;border:none;padding:16px;font-weight:900;font-size:15px;letter-spacing:1px;border-radius:4px;cursor:pointer;transition:0.3s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 15px rgba(200,169,110,0.2);}
.btn-ai:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(200,169,110,0.3);filter:brightness(1.1);}
.btn-ai:disabled{filter:grayscale(1);cursor:not-allowed;opacity:0.6;}

/* Result Styling */
.ai-section{margin-bottom:24px;}
.ai-title{color:var(--gold2);font-weight:700;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ai-title::before{content:"";width:3px;height:12px;background:var(--gold);border-radius:10px;}
.ai-content{color:#d1d5db;font-size:14px;line-height:1.8;white-space:pre-wrap;}

.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:15px;}
.spin{width:24px;height:24px;border:2px solid var(--bor);border-top-color:var(--gold);border-radius:50%;animation:s 0.8s infinite linear;}
@keyframes s{to{transform:rotate(360deg)}}

/* Export Buttons */
.export-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;}
.btn-ex{background:var(--sur2);color:var(--text);border:1px solid var(--bor);padding:10px;font-size:12px;border-radius:4px;cursor:pointer;font-weight:600;transition:0.2s;}
.btn-ex:hover{background:var(--bor);border-color:var(--dim);}

</style>
</head>
<body>

<div class="app-wrapper">
    <header>
        <div style="display:flex;align-items:center;gap:15px;">
            <div style="width:32px;height:32px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;">憲</div>
            <div>
                <h1 style="font-size:16px;font-weight:900;letter-spacing:1px;">智慧偵詢分析系統 <span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:5px;">V3.5 法規資料庫強化版</span></h1>
                <p class="mono" style="font-size:9px;color:var(--gold);letter-spacing:2px;opacity:0.8;">MILITARY POLICE AI INTELLIGENCE</p>
            </div>
        </div>
        <div style="display:flex;gap:12px;">
            <div style="text-align:right;">
                <p style="font-size:10px;color:var(--muted);">目前狀態</p>
                <p class="mono" style="font-size:11px;color:var(--green);">● SYSTEM READY</p>
            </div>
        </div>
    </header>

    <main>
        <div class="col-input">
            <div class="input-card">
                <div class="card-header">
                    <span class="card-label">Evidence & Records / 案情與筆錄</span>
                    <span class="mono" style="font-size:10px;color:var(--dim);">UTF-8 ENCODING</span>
                </div>
                <textarea id="userInput" placeholder="請在此貼入詢問紀錄、筆錄摘要或初步調查報告..."></textarea>
                <div style="padding:15px;background:rgba(0,0,0,0.3);border-top:1px solid var(--bor);">
                    <button class="btn-ai" id="runBtn" onclick="runAnalysis()">
                        <span>✦ 執行 AI 法律構成要件鑑定</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-output">
            <div class="output-card">
                <div class="card-header">
                    <span class="card-label">Legal Analysis / 鑑定結果</span>
                    <button onclick="clearResult()" style="background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;">清除</button>
                </div>
                <div id="resultArea">
                    <div class="loader">
                        <p style="font-size:12px;color:var(--dim);">請在左側輸入案情並啟動分析</p>
                    </div>
                </div>
                <div style="padding:15px;background:var(--sur2);border-top:1px solid var(--bor);">
                    <div class="export-group">
                        <button class="btn-ex" onclick="exportWord()">匯出鑑定報告 (.docx)</button>
                        <button class="btn-ex" onclick="window.print()">列印分析結果</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
const resArea = document.getElementById("resultArea");
const runBtn = document.getElementById("runBtn");

async function runAnalysis() {
    const text = document.getElementById("userInput").value.trim();
    if(!text) return alert("請輸入分析內容");

    runBtn.disabled = true;
    resArea.innerHTML = `<div class="loader"><div class="spin"></div><p style="font-size:13px;color:var(--gold2);">正在對照國防法規 XML 資料庫並進行鑑定...</p></div>`;

    // 請務必填入您的 Groq API Key
    const apiKey = ""; 

    const systemPrompt = `你是一位資深的國防軍事法學專家。請針對使用者輸入的詢問紀錄或案情，進行以下深度的法律與行政鑑定：

1. 【刑事鑑定】：依據《陸海空軍刑法》判斷是否涉及洩密、資敵、違抗命令、職務利誘或貪瀆犯罪。
2. 【行政違失】：依據《國防部組織法》及《軍官士官退撫基金繳費作業規定》，分析承辦人或當事人是否涉及「行政疏失」或「遲辦致生國庫利息損失」。
3. 【軍紀監察】：引用相關軍紀督察程序，判斷是否應移送「學員生事務處」或「督察部門」。
4. 【國安分級】：若涉及機密外洩，請依《國家機密保護法》建議鑑定之機密等級（絕對機密、極機密、機密）。

請以嚴謹的軍方公文口吻回答，條列重點。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{role: "system", content: systemPrompt}, {role: "user", content: text}],
                temperature: 0.3
            })
        });
        const data = await response.json();
        const result = data.choices[0].message.content;
        renderResult(result);
    } catch (e) {
        resArea.innerHTML = `<p style="color:var(--red);padding:20px;">分析失敗：連線錯誤或 API Key 未設定。</p>`;
    } finally {
        runBtn.disabled = false;
    }
}

function renderResult(md) {
    // 簡單格式化
    const sections = md.split('\n\n');
    let html = '';
    sections.forEach(sec => {
        if(sec.includes('：')) {
            const lines = sec.split('\n');
            html += `<div class="ai-section"><p class="ai-title">${lines[0]}</p><p class="ai-content">${lines.slice(1).join('\n')}</p></div>`;
        } else {
            html += `<div class="ai-section"><p class="ai-content">${sec}</p></div>`;
        }
    });
    resArea.innerHTML = html;
}

function clearResult() {
    resArea.innerHTML = `<div class="loader"><p style="font-size:12px;color:var(--dim);">請在左側輸入案情並啟動分析</p></div>`;
    document.getElementById("userInput").value = "";
}

async function exportWord() {
    const content = resArea.innerText;
    if(!content || content.includes("請在左側輸入")) return alert("尚無分析結果可匯出");

    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;
    const doc = new Document({
        sections: [{
            children: [
                new Paragraph({ text: "司法警察智慧偵詢鑑定分析報告", heading: HeadingLevel.HEADING_1 }),
                new Paragraph({ text: "\n" }),
                new Paragraph({ children: [new TextRun({ text: content, font: "Noto Sans TC" })] })
            ]
        }]
    });
    const blob = await Packer.toBlob(doc);
    saveAs(blob, `智慧偵詢報告_${new Date().toLocaleDateString()}.docx`);
}
</script>
</body>
</html>
