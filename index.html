<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧偵詢分析系統 (法規強化版)</title>
    <style>
        :root{--bg:#0a0c0f;--sur:#111418;--bor:#252a32;--gold:#c8a96e;--gold2:#e8c98e;--text:#e8eaf0;}
        body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;margin:0;padding:20px;}
        .container{max-width:1000px;margin:0 auto;}
        .card{background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:25px;margin-bottom:20px;}
        textarea{width:100%;height:250px;background:#050607;color:#fff;border:1px solid var(--bor);padding:15px;border-radius:4px;font-size:15px;line-height:1.6;resize:none;}
        .btn-ai{background:linear-gradient(135deg,#b8944a,#c8a96e);color:#000;border:none;padding:18px;font-weight:900;cursor:pointer;width:100%;border-radius:4px;font-size:16px;}
        #result{white-space:pre-wrap;line-height:1.8;color:#d1d5db;font-size:15px;padding:15px;background:rgba(255,255,255,0.02);border-radius:4px;}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 style="color:var(--gold2); font-size:22px;">⚖️ 智慧偵詢分析系統 (含行政法規邏輯)</h1>
        <p style="font-size:14px; color:#8892a0;">整合國防部組織法、軍紀監察及行政處分規定。</p>
        <textarea id="aiInput" placeholder="請貼入詢問紀錄..."></textarea>
        <button class="btn-ai" onclick="analyzeCase()">執行 AI 深度鑑定 (刑法 + 行政處分)</button>
    </div>
    <div id="resultCard" class="card" style="display:none;">
        <h3 style="color:var(--gold2);">分析報告結果</h3>
        <div id="result"></div>
    </div>
</div>

<script>
async function analyzeCase() {
    const input = document.getElementById('aiInput').value;
    if(!input) return;
    
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('result').innerText = "系統正在對照國防法規 XML 資料庫中...";

    const apiKey = ""; // <--- 在此填入您的 Groq API Key

    const systemPrompt = `你是一位國防法規專家。針對輸入案情，請依據以下基準分析：
    1. 刑事：陸海空軍刑法、刑事訴訟法。
    2. 行政：國防部組織法、軍官士官退撫基金繳費作業規定、軍紀監察規範。
    3. 重點：
       - 若涉及『退撫基金』，分析其權責歸屬（參謀本部人次室、各軍司令部）。
       - 若涉及『軍紀』，引用國軍資通安全獎懲或督察程序。
       - 若涉及『國安』，依據國家機密保護法判定。
    請列出：【可能涉及罪名】、【行政處分建議】、【法源依據條號】。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{role: "system", content: systemPrompt}, {role: "user", content: input}]
            })
        });
        const data = await response.json();
        document.getElementById('result').innerText = data.choices[0].message.content;
    } catch (e) {
        document.getElementById('result').innerText = "系統異常，請確認 API Key 是否正確。";
    }
}
</script>
</body>
</html>
