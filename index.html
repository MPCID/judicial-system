<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧偵詢分析系統｜臺北憲兵隊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0c0f;--sur:#111418;--bor:#252a32;--gold:#c8a96e;--gold2:#e8c98e;--text:#e8eaf0;}
        body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;margin:0;padding:20px;min-height:100vh;}
        .container{max-width:900px;margin:20px auto;}
        .card{background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:25px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
        h1{color:var(--gold2);font-size:22px;margin-top:0;}
        textarea{width:100%;height:250px;background:#050607;color:#fff;border:1px solid var(--bor);padding:20px;border-radius:4px;font-size:15px;line-height:1.7;margin-bottom:20px;outline:none;resize:none;}
        textarea:focus{border-color:var(--gold);}
        .btn-ai{background:linear-gradient(135deg,#b8944a,#c8a96e);color:#000;border:none;padding:18px;font-weight:900;cursor:pointer;width:100%;border-radius:4px;font-size:16px;letter-spacing:1px;transition:0.2s;}
        .btn-ai:hover{opacity:0.9;transform:translateY(-1px);}
        #resultCard{display:none;border-left:4px solid var(--gold);}
        #result{white-space:pre-wrap;line-height:1.8;color:#d1d5db;font-size:15px;}
        .loader{color:var(--gold);font-style:italic;margin-bottom:10px;}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>⚖️ 司法警察智慧偵詢分析系統</h1>
        <p style="font-size:14px; color:#8892a0; margin-bottom:20px;">
            整合《陸海空軍刑法》、《國防部組織法》及《退撫基金撥補作業規定》鑑定邏輯。
        </p>
        <textarea id="aiInput" placeholder="請貼入詢問紀錄或案情摘要..."></textarea>
        <button class="btn-ai" onclick="analyzeCase()">執行 AI 深度法律鑑定</button>
    </div>

    <div id="resultCard" class="card">
        <h3 style="color:var(--gold2); border-bottom:1px solid var(--bor); padding-bottom:10px; margin-bottom:20px;">AI 法律定性鑑定報告</h3>
        <div id="result"></div>
    </div>
</div>

<script>
async function analyzeCase() {
    const input = document.getElementById('aiInput').value;
    if(!input) return alert("請輸入內容");
    
    const resultCard = document.getElementById('resultCard');
    const resultDiv = document.getElementById('result');
    
    resultCard.style.display = 'block';
    resultDiv.innerHTML = '<div class="loader">正在調用國防法規資料庫進行比對分析...</div>';

    // 請務必在下方引號內填入您的 Groq API Key
    const apiKey = "請在此填入您的API_KEY"; 

    const systemPrompt = `你是一位資深的國防軍事法學專家。請針對使用者輸入的案情，進行以下鑑定：
    1. 【刑事分析】：依據《陸海空軍刑法》判定是否涉及洩密、資敵、抗命或職務犯罪。
    2. 【行政違失】：依據《國防部組織法》及《軍官士官退撫基金繳費作業規定》，判斷是否涉及「遲辦利息損失」或行政疏失。
    3. 【處分依據】：明確指出對應的法條條號與處分建議。
    請使用繁體中文，語氣嚴謹專業。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{role: "system", content: systemPrompt}, {role: "user", content: input}]
            })
        });
        const data = await response.json();
        resultDiv.innerText = data.choices[0].message.content;
    } catch (e) {
        resultDiv.innerText = "系統連接失敗，請檢查網路連線或 API Key 是否正確。";
    }
}
</script>
</body>
</html>
