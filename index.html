<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>智慧偵詢分析系統｜臺北憲兵隊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
:root{--bg:#0a0c0f;--sur:#111418;--sur2:#181c22;--bor:#252a32;--bor2:#2e3440;--gold:#c8a96e;--gold2:#e8c98e;--red:#e05252;--green:#4caf7d;--blue:#4a90d9;--text:#e8eaf0;--muted:#6b7280;--dim:#3d4452;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;height:100vh;overflow:hidden;}
.serif{font-family:'Noto Serif TC',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bor2);border-radius:10px;}

/* Layout */
.app-wrapper{display:flex;flex-direction:column;height:100vh;background-image:radial-gradient(circle at 50% 0%, #161a22 0%, #0a0c0f 100%);}
header{flex-shrink:0;height:60px;background:#000;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100;}
main{flex:1;display:flex;overflow:hidden;padding:20px;gap:20px;}

/* Columns */
.col-input{flex:1;display:flex;flex-direction:column;gap:15px;min-width:0;}
.col-output{width:480px;display:flex;flex-direction:column;gap:15px;flex-shrink:0;}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,0.4);}
.card-header{padding:12px 18px;background:var(--sur2);border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;}
.card-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;}

textarea{flex:1;background:transparent;border:none;color:#fff;padding:20px;font-size:15px;line-height:1.7;resize:none;outline:none;}
#resultArea{flex:1;overflow-y:auto;padding:20px;background-image:linear-gradient(to bottom, transparent, rgba(0,0,0,0.1));}

/* API Modal */
#apiModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(10px);}
.modal-content{background:var(--sur);border:1px solid var(--gold);padding:30px;border-radius:10px;width:380px;text-align:center;}
.modal-input{width:100%;padding:12px;margin:15px 0;background:#000;border:1px solid var(--bor);color:var(--gold2);border-radius:4px;outline:none;}

.btn-ai{background:linear-gradient(135deg,#b8944a,#c8a96e);color:#000;border:none;padding:16px;font-weight:900;font-size:15px;border-radius:4px;cursor:pointer;width:100%;transition:0.2s;}
.btn-ai:hover{filter:brightness(1.1);transform:translateY(-1px);}

.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:15px;}
.spin{width:20px;height:20px;border:2px solid var(--bor);border-top-color:var(--gold);border-radius:50%;animation:s 1s infinite linear;}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="apiModal">
    <div class="modal-content">
        <p class="serif" style="color:var(--gold);font-size:18px;margin-bottom:10px;">🛡️ 司法警察系統驗證</p>
        <p style="font-size:12px;color:var(--muted);">請輸入 Groq API Key 以開啟實戰鑑定系統</p>
        <input type="password" id="keyInput" class="modal-input" placeholder="gsk_...">
        <button class="btn-ai" onclick="saveKey()">儲存並啟動系統</button>
    </div>
</div>

<div class="app-wrapper">
    <header>
        <div style="display:flex;align-items:center;gap:15px;">
            <div style="width:32px;height:32px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;">憲</div>
            <div>
                <h1 style="font-size:16px;font-weight:900;letter-spacing:1px;">智慧偵詢分析系統 <span style="font-size:10px;color:var(--muted);margin-left:5px;">V5.0 原始介面回歸版</span></h1>
                <p class="mono" style="font-size:9px;color:var(--gold);letter-spacing:2px;opacity:0.8;">MILITARY POLICE AI INTELLIGENCE</p>
            </div>
        </div>
        <button onclick="resetKey()" style="background:none;border:1px solid var(--bor);color:var(--muted);font-size:10px;padding:4px 8px;border-radius:4px;cursor:pointer;">重設 API Key</button>
    </header>

    <main>
        <div class="col-input">
            <div class="card" style="flex:1;">
                <div class="card-header"><span class="card-label">Evidence & Records / 案情摘要與筆錄</span></div>
                <textarea id="userInput" placeholder="請在此貼入詢問紀錄、資安違規事由或案情摘要..."></textarea>
                <div style="padding:15px;background:rgba(0,0,0,0.3);border-top:1px solid var(--bor);">
                    <button class="btn-ai" id="runBtn" onclick="runAnalysis()">✦ 啟動全量法規與資安鑑定</button>
                </div>
            </div>
        </div>

        <div class="col-output">
            <div class="card" style="flex:1;">
                <div class="card-header"><span class="card-label">Legal Analysis / 深度分析鑑定報告</span></div>
                <div id="resultArea"><div class="loader"><p style="font-size:12px;">等待資料輸入中...</p></div></div>
                <div style="padding:15px;background:var(--sur2);border-top:1px solid var(--bor);">
                    <button class="btn-ai" style="padding:10px;font-size:12px;" onclick="exportWord()">匯出鑑定報告 (.docx)</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
let savedKey = localStorage.getItem('groq_api_key');
window.onload = () => { if (!savedKey) document.getElementById('apiModal').style.display = 'flex'; };

function saveKey() {
    const k = document.getElementById('keyInput').value.trim();
    if (k.startsWith('gsk_')) { localStorage.setItem('groq_api_key', k); savedKey = k; document.getElementById('apiModal').style.display = 'none'; }
    else { alert("格式錯誤"); }
}
function resetKey() { localStorage.removeItem('groq_api_key'); location.reload(); }

async function runAnalysis() {
    const text = document.getElementById("userInput").value.trim();
    if(!text) return alert("請輸入內容");
    
    const resArea = document.getElementById("resultArea");
    resArea.innerHTML = `<div class="loader"><div class="spin"></div><p style="font-size:13px;color:var(--gold2);">對照 114年資安新規與軍法庫中...</p></div>`;

    const sysPrompt = `你是一位司法警察專家。請對案情進行【並列且同步】的鑑定：
1. 【資安鑑定】：必須嚴格參照《114年8月國軍資通安全獎懲規定》。針對私帶手機、大陸機、未裝MDM等，給予申誡、記過、大過級距建議。
2. 【刑事鑑定】：同步檢索《刑法》與《陸海空軍刑法》。
3. 【特別法】：包含毒品條例、國安法、貪污治罪條例。
4. 【程序】：依據《刑訴法》提供指引。

請條列重點，並以專業公文口吻回覆。`;

    try {
        const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${savedKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{role: "system", content: sysPrompt}, {role: "user", content: text}],
                temperature: 0.2
            })
        });
        const data = await resp.json();
        resArea.innerHTML = `<div style="padding:10px;white-space:pre-wrap;line-height:1.8;color:#d1d5db;">${data.choices[0].message.content}</div>`;
    } catch (e) { resArea.innerHTML = `<p style="color:var(--red);padding:20px;">分析失敗。</p>`; }
}

async function exportWord() {
    const content = document.getElementById("resultArea").innerText;
    const { Document, Packer, Paragraph } = docx;
    const doc = new Document({ sections: [{ children: [new Paragraph({ text: "司法警察鑑定報告" }), new Paragraph({ text: content })] }] });
    const blob = await Packer.toBlob(doc);
    saveAs(blob, `智慧偵詢報告.docx`);
}
</script>
</body>
</html>
