<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>智慧偵詢分析系統｜臺北憲兵隊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
:root{--bg:#0a0c0f;--sur:#111418;--sur2:#181c22;--bor:#252a32;--bor2:#2e3440;--gold:#c8a96e;--gold2:#e8c98e;--red:#e05252;--green:#4caf7d;--blue:#4a90d9;--text:#e8eaf0;--muted:#6b7280;--dim:#3d4452;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;height:100vh;overflow:hidden;}
.serif{font-family:'Noto Serif TC',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bor2);border-radius:10px;}

/* Layout */
.app-wrapper{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:420px;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;flex-shrink:0;}
.main-view{flex:1;background:var(--bg);display:flex;flex-direction:column;min-width:0;}

/* API Modal */
#apiModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(10px);}
.modal-content{background:var(--sur);border:1px solid var(--gold);padding:30px;border-radius:10px;width:380px;text-align:center;}
.modal-input{width:100%;padding:12px;margin:15px 0;background:#000;border:1px solid var(--bor);color:var(--gold2);border-radius:4px;outline:none;}

/* Sidebar Components */
header{padding:24px;border-bottom:1px solid var(--bor);background-image:linear-gradient(to bottom, #1a1d22, transparent);}
.input-group{flex:1;padding:24px;display:flex;flex-direction:column;gap:15px;overflow-y:auto;}
textarea{width:100%;height:320px;background:rgba(0,0,0,0.1);border:1px solid var(--bor2);color:var(--text);padding:15px;border-radius:8px;font-size:15px;line-height:1.7;resize:none;outline:none;transition:0.3s;}
textarea:focus{border-color:var(--gold);background:rgba(0,0,0,0.3);}

/* Law Tags */
.tag-container{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.law-tag{display:inline-block;padding:4px 10px;background:var(--sur2);border:1px solid var(--bor2);color:var(--gold2);font-size:11px;text-decoration:none;border-radius:4px;transition:0.2s;}
.law-tag:hover{border-color:var(--gold);background:var(--bor2);}

.btn-run{background:linear-gradient(135deg,#b8944a,#c8a96e);color:#0a0c0f;border:none;padding:16px;border-radius:8px;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}

/* Main Output Component */
.output-header{padding:15px 24px;background:var(--sur2);border-bottom:1px solid var(--bor);display:flex;justify-content:space-between;align-items:center;}
.result-area{flex:1;overflow-y:auto;padding:30px;background-image:linear-gradient(to bottom, transparent, rgba(0,0,0,0.2));}
.result-content{line-height:1.8;color:#d1d5db;font-size:15px;white-space:pre-wrap;max-width:850px;margin:0 auto;}

.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:15px;}
.spin{width:24px;height:24px;border:2px solid var(--bor);border-top-color:var(--gold);border-radius:50%;animation:s 1s infinite linear;}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="apiModal">
    <div class="modal-content">
        <p class="serif" style="color:var(--gold);font-size:18px;margin-bottom:10px;">🛡️ 司法警察系統驗證</p>
        <p style="font-size:12px;color:var(--muted);">請輸入 Groq API Key 以開啟實戰鑑定系統</p>
        <input type="password" id="keyInput" class="modal-input" placeholder="gsk_...">
        <button class="btn-run" style="width:100%;" onclick="saveKey()">儲存並啟動系統</button>
    </div>
</div>

<div class="app-wrapper">
    <aside class="sidebar">
        <header>
            <div style="display:flex;align-items:center;gap:15px;margin-bottom:20px;">
                <div style="width:36px;height:36px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:18px;">憲</div>
                <div>
                    <h1 class="serif" style="font-size:18px;font-weight:900;letter-spacing:1px;">智慧偵詢分析系統</h1>
                    <p class="mono" style="font-size:9px;color:var(--gold);letter-spacing:2px;opacity:0.7;">TAIPEI MILITARY POLICE</p>
                </div>
            </div>
            
            <div class="tag-container">
                <a class="law-tag" href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0000001" target="_blank">刑法</a>
                <a class="law-tag" href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0010001" target="_blank">刑訴法</a>
                <a class="law-tag" href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=F0120001" target="_blank">軍刑法</a>
                <a class="law-tag" href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0000008" target="_blank">毒品</a>
                <a class="law-tag" href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030028" target="_blank">國安</a>
            </div>
            <p style="font-size:10px;color:var(--dim);">已整合 114年資安獎懲規定</p>
        </header>

        <div class="input-group">
            <textarea id="userInput" placeholder="請貼入詢問紀錄...例如：私自攜帶大陸廠牌手機入營且未裝MDM..."></textarea>
            <button class="btn-run" id="runBtn" onclick="runAnalysis()">
                <span>啟動 AI 深度分析鑑定</span>
            </button>
            <button onclick="resetKey()" style="background:none;border:none;color:var(--dim);font-size:10px;cursor:pointer;margin-top:15px;text-align:left;">➔ 重設 API Key</button>
        </div>
    </aside>

    <main class="main-view">
        <div class="output-header">
            <span class="mono" style="font-size:11px;color:var(--gold);letter-spacing:1px;">▸ ANALYSIS_REPORT_GEN</span>
            <button onclick="exportWord()" style="background:var(--sur);border:1px solid var(--bor);color:var(--gold2);padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;">匯出報告 (.docx)</button>
        </div>
        <div class="result-area" id="resultArea">
            <div class="loader">
                <p style="font-size:13px;color:var(--dim);">請在左側輸入案情摘要並啟動分析</p>
            </div>
        </div>
    </main>
</div>

<script>
let savedKey = localStorage.getItem('groq_api_key');
window.onload = () => { if (!savedKey) document.getElementById('apiModal').style.display = 'flex'; };

function saveKey() {
    const k = document.getElementById('keyInput').value.trim();
    if (k.startsWith('gsk_')) { localStorage.setItem('groq_api_key', k); savedKey = k; document.getElementById('apiModal').style.display = 'none'; }
    else { alert("Key 格式不正確"); }
}

function resetKey() { localStorage.removeItem('groq_api_key'); location.reload(); }

async function runAnalysis() {
    const text = document.getElementById("userInput").value.trim();
    if(!text) return alert("請輸入內容");
    const resArea = document.getElementById("resultArea");
    
    resArea.innerHTML = `<div class="loader"><div class="spin"></div><p style="font-size:13px;color:var(--gold2);">正在進行 114年資安規定與刑法全量比對鑑定...</p></div>`;

    const sysPrompt = `你是一位司法警察專家。請針對內容進行鑑定：
1. 【刑事鑑定】：同步對照《刑法》與《陸海空軍刑法》判定罪名。
2. 【行政與資安】：嚴格依據《114年8月修正之國軍資通安全獎懲規定》。針對私帶手機、大陸機、未裝MDM等給予明確懲罰建議。
3. 【程序鑑定】：對照《刑訴法》提供作業指引與時限。
請以專業公文口吻條列回覆。`;

    try {
        const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${savedKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{role: "system", content: sysPrompt}, {role: "user", content: text}],
                temperature: 0.2
            })
        });
        const data = await resp.json();
        const content = data.choices[0].message.content;
        resArea.innerHTML = `<div class="result-content">${content}</div>`;
    } catch (e) {
        resArea.innerHTML = `<p style="color:var(--red);padding:20px;">分析失敗，請檢查網路或 API Key。</p>`;
    }
}

async function exportWord() {
    const content = document.getElementById("resultArea").innerText;
    const { Document, Packer, Paragraph } = docx;
    const doc = new Document({ sections: [{ children: [new Paragraph({ text: "司法警察鑑定報告" }), new Paragraph({ text: content })] }] });
    const blob = await Packer.toBlob(doc);
    saveAs(blob, `智慧偵詢報告.docx`);
}
</script>
</body>
</html>
